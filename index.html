<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>每日 5 單字小學堂 - 柚子老師製作</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts 友善圓體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Confetti 彩帶特效 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      font-family: 'Zen Maru Gothic', 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      touch-action: manipulation;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      background-color: #FEF9E7;
    }

    .pomelo-btn-shadow {
      box-shadow: 0 4px 0px #d97706;
      transition: all 0.1s ease-in-out;
    }
    .pomelo-btn-shadow:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px #d97706;
    }

    .mint-btn-shadow {
      box-shadow: 0 4px 0px #059669;
      transition: all 0.1s ease-in-out;
    }
    .mint-btn-shadow:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px #059669;
    }

    .blue-btn-shadow {
      box-shadow: 0 4px 0px #2563eb;
      transition: all 0.1s ease-in-out;
    }
    .blue-btn-shadow:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px #2563eb;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #FEF3C7;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #FBBF24;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #F59E0B;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-amber-200">

  <!-- 頂部導覽列 (字體加大、觸控舒適) -->
  <header class="bg-white/95 backdrop-blur border-b-2 border-amber-200 sticky top-0 z-40 px-4 py-3 sm:py-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-amber-900 tracking-wide">每日 5 字小學堂</h1>
        <span class="bg-amber-100 text-amber-800 text-sm sm:text-base font-bold px-3 py-1 rounded-full border border-amber-300">國小高年級</span>
      </div>

      <!-- 導覽分頁按鈕 (已拿掉發布教學) -->
      <nav class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 justify-center">
        <button onclick="switchTab('daily')" id="tab-daily" class="px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-amber-500 text-white shadow-sm">
          今日單字
        </button>
        <button onclick="switchTab('quiz-choice')" id="tab-quiz-choice" class="px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-white text-slate-600 hover:bg-amber-50">
          字義測驗
        </button>
        <button onclick="switchTab('quiz-cloze')" id="tab-quiz-cloze" class="px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-white text-slate-600 hover:bg-amber-50">
          克漏字挑戰
        </button>
        <button onclick="switchTab('library')" id="tab-library" class="px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-white text-slate-600 hover:bg-amber-50">
          主題字庫
        </button>
      </nav>
    </div>
  </header>

  <!-- 主內容容器 (支援滑動、自適應比例) -->
  <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-1">

    <!-- 台灣時間與日期選擇器 (可看昨天、鎖定明天) -->
    <div class="bg-white border-2 border-amber-200 rounded-3xl p-4 sm:p-5 mb-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📅</span>
        <div>
          <span class="text-xs font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-md">台灣時間</span>
          <div id="display-date-str" class="text-lg sm:text-xl font-black text-slate-700">載入中...</div>
        </div>
      </div>

      <!-- 日期切換控制項 -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-center">
        <button id="btn-prev-day" onclick="changeDay(-1)" class="px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-2xl font-bold text-base transition pomelo-btn-shadow flex items-center gap-1">
          <span>◀</span> 前一天溫習
        </button>
        
        <input type="date" id="date-picker" onchange="onDateSelected(this.value)" class="border-2 border-amber-300 rounded-2xl px-3 py-2 text-base font-bold text-slate-700 bg-amber-50/50 focus:outline-none focus:ring-2 focus:ring-amber-400">

        <button id="btn-next-day" onclick="changeDay(1)" class="px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-2xl font-bold text-base transition pomelo-btn-shadow flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none">
          後一天 <span>▶</span>
        </button>
      </div>
    </div>

    <!-- 1. 今日單字分頁 -->
    <section id="view-daily" class="space-y-6">
      <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-5 flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-amber-400 text-white flex items-center justify-center text-2xl font-bold shadow-inner">
            5
          </div>
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-amber-900" id="daily-banner-title">今日進度：精選 5 單字</h2>
            <p class="text-sm sm:text-base text-slate-500 font-medium">每天花 3 分鐘大聲念，英文進步看得見！</p>
          </div>
        </div>
        <button id="btn-today-reset" onclick="resetToToday()" class="hidden px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-2xl font-bold text-base shadow pomelo-btn-shadow">
          回今天進度
        </button>
      </div>

      <!-- 5 個單字卡片容器 -->
      <div id="daily-cards-container" class="space-y-5">
        <!-- 由 JavaScript 動態渲染 -->
      </div>
    </section>

    <!-- 2. 字義測驗分頁 -->
    <section id="view-quiz-choice" class="hidden space-y-6">
      <div class="bg-white border-2 border-amber-200 rounded-3xl p-6 sm:p-8 shadow-sm">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-amber-100">
          <div>
            <span class="text-sm font-bold text-amber-600 bg-amber-100 px-3 py-1 rounded-full">四選一測驗</span>
            <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 mt-2">這個單字是什麼意思？</h3>
          </div>
          <div class="text-right">
            <span class="text-sm text-slate-500 font-bold">目前進度</span>
            <div id="choice-progress" class="text-xl sm:text-2xl font-black text-amber-600">1 / 5</div>
          </div>
        </div>

        <div class="text-center my-6">
          <div id="choice-question-word" class="text-4xl sm:text-5xl font-black text-amber-900 tracking-wide mb-3">
            word
          </div>
          <button id="choice-audio-btn" onclick="speakCurrentQuizWord()" class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-800 text-base sm:text-lg font-bold transition">
            🔊 聽發音
          </button>
        </div>

        <!-- 四個選項按鈕 (加大高度，平板好點按) -->
        <div id="choice-options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
          <!-- 由 JavaScript 動態生成選項按鈕 -->
        </div>

        <!-- 答題回饋訊息 -->
        <div id="choice-feedback" class="mt-6 text-center text-lg sm:text-xl font-black min-h-[32px]"></div>

        <div class="mt-6 flex justify-end">
          <button id="choice-next-btn" onclick="nextChoiceQuiz()" class="hidden px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-2xl font-black text-lg shadow-md pomelo-btn-shadow">
            下一題 ➔
          </button>
        </div>
      </div>
    </section>

    <!-- 3. 克漏字填空測驗分頁 -->
    <section id="view-quiz-cloze" class="hidden space-y-6">
      <div class="bg-white border-2 border-emerald-200 rounded-3xl p-6 sm:p-8 shadow-sm">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-emerald-100">
          <div>
            <span class="text-sm font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">例句克漏字填空</span>
            <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 mt-2">根據句子填入正確單字</h3>
          </div>
          <div class="text-right">
            <span class="text-sm text-slate-500 font-bold">目前進度</span>
            <div id="cloze-progress" class="text-xl sm:text-2xl font-black text-emerald-600">1 / 5</div>
          </div>
        </div>

        <!-- 例句題目 -->
        <div class="bg-emerald-50/70 border-2 border-emerald-200 rounded-2xl p-6 my-6 text-center">
          <div id="cloze-sentence-display" class="text-2xl sm:text-3xl font-bold text-slate-800 leading-relaxed">
            I eat an <span class="text-emerald-600 underline font-black">______</span> every day.
          </div>
          <div id="cloze-sentence-zh" class="text-lg sm:text-xl text-slate-600 mt-3 font-semibold">
            我每天吃一顆蘋果。
          </div>
        </div>

        <!-- 填空輸入區與提示 -->
        <div class="max-w-md mx-auto space-y-4">
          <div class="flex gap-2">
            <input type="text" id="cloze-user-input" placeholder="請輸入單字..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="flex-1 border-2 border-emerald-300 rounded-2xl px-5 py-3 text-xl font-bold text-slate-800 focus:outline-none focus:ring-4 focus:ring-emerald-200 text-center">
            <button onclick="checkClozeAnswer()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-lg mint-btn-shadow">
              送出
            </button>
          </div>

          <div class="flex items-center justify-between px-2 text-sm sm:text-base font-bold text-slate-500">
            <span id="cloze-hint-text">💡 提示：字首是 a，共 5 個字母</span>
            <button onclick="revealClozeHint()" class="text-emerald-700 underline hover:text-emerald-800">
              顯示更多提示
            </button>
          </div>
        </div>

        <!-- 回饋訊息 -->
        <div id="cloze-feedback" class="mt-6 text-center text-lg sm:text-xl font-black min-h-[32px]"></div>

        <div class="mt-6 flex justify-end">
          <button id="cloze-next-btn" onclick="nextClozeQuiz()" class="hidden px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-lg mint-btn-shadow">
            下一題 ➔
          </button>
        </div>
      </div>
    </section>

    <!-- 4. 1500 主題分類字庫清單 -->
    <section id="view-library" class="hidden space-y-6">
      <div class="bg-white border-2 border-amber-200 rounded-3xl p-6 shadow-sm">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h3 class="text-2xl font-extrabold text-slate-800">國小常用 1500 核心字庫</h3>
            <p class="text-base text-slate-500 mt-1">點擊主題即可快速篩選分類，共收錄各主題實用基礎單字與例句。</p>
          </div>
          <div class="text-amber-700 font-extrabold text-lg bg-amber-50 border border-amber-200 px-4 py-2 rounded-2xl">
            收錄：<span id="lib-total-count" class="text-amber-900 font-black">1500</span> 字
          </div>
        </div>

        <!-- 主題分類按鈕列 -->
        <div id="category-filter-bar" class="flex flex-wrap gap-2 pb-4 border-b border-amber-100">
          <button onclick="filterCategory('ALL')" class="cat-pill active-cat px-4 py-2 rounded-xl text-base font-bold bg-amber-500 text-white shadow-sm transition">
            全部單字
          </button>
          <!-- 由 JS 填充各主題分類標籤 -->
        </div>

        <!-- 關鍵字搜尋框 -->
        <div class="my-4">
          <input type="text" id="lib-search-input" oninput="renderLibraryWords()" placeholder="🔍 搜尋英文單字或中文意思..." class="w-full border-2 border-amber-200 rounded-2xl px-4 py-3 text-lg font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>

        <!-- 單字瀏覽列表 (垂直滑順滾動) -->
        <div id="library-words-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[550px] overflow-y-auto p-1">
          <!-- 由 JavaScript 動態生成單字卡 -->
        </div>
      </div>
    </section>

  </main>

  <!-- 頁面底部：精準還原「柚子老師製作」深藍膠囊標章 -->
  <footer class="py-8 flex justify-center items-center">
    <div class="bg-[#1e293b] border border-slate-700/80 rounded-full px-6 py-2.5 flex items-center gap-3 shadow-lg select-none">
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center overflow-hidden flex-shrink-0">
        <img src="teacher.png" alt="柚子老師" class="w-full h-full object-cover" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%23ffffff\'/><circle cx=\'30\' cy=\'40\' r=\'12\' fill=\'%23000000\'/><circle cx=\'70\' cy=\'40\' r=\'12\' fill=\'%23000000\'/><circle cx=\'42\' cy=\'50\' r=\'6\' fill=\'%23000000\'/><circle cx=\'58\' cy=\'50\' r=\'6\' fill=\'%23000000\'/><path d=\'M46 62 Q50 66 54 62\' stroke=\'%23000000\' stroke-width=\'3\' fill=\'none\'/></svg>'">
      </div>
      <span class="text-white font-extrabold text-lg sm:text-xl tracking-wider">
        柚子老師製作
      </span>
    </div>
  </footer>

    const baseLength = WORD_BANK.length;

      const template = WORD_BANK[i % baseLength];
      const seq = Math.floor(i / baseLength) + 1;
      WORD_BANK.push({
        id: idCounter++,

    /* ==========================================================
       2. 台灣時區 (Asia/Taipei UTC+8) 時間與日期導航
       ========================================================== */
    function getTaiwanDateObject() {
      const now = new Date();
      // 轉換至台灣時區
      const twString = now.toLocaleString("en-US", { timeZone: "Asia/Taipei" });
      return new Date(twString);
    }

    function formatDateYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const TAIWAN_TODAY_OBJ = getTaiwanDateObject();
    const TAIWAN_TODAY_STR = formatDateYMD(TAIWAN_TODAY_OBJ);
    let selectedDateStr = TAIWAN_TODAY_STR;

    // 確定性雜湊演算法：依日期字串取 5 個固定單字
    function getWordsForDate(dateStr) {
      let hash = 0;
      for (let i = 0; i < dateStr.length; i++) {
        hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
        hash |= 0;
      }
      const absHash = Math.abs(hash);
      const startIndex = absHash % (WORD_BANK.length - 5);
      return WORD_BANK.slice(startIndex, startIndex + 5);
    }

    /* ==========================================================
       3. 音效引擎 (Web Audio API - 零外部檔案依賴，100% 響亮)
       ========================================================== */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 答對音效：任天堂過關清脆大三度 (C5 -> E5 -> G5)
    function playSuccessSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.3, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.25);
        });
      } catch (e) {
        console.log("音效播報就緒");
      }
    }

    // 答錯音效：溫柔彈性泡泡聲 (不挫折、激勵再試一次)
    function playWrongSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.22);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {
        console.log("音效播報就緒");
      }
    }

    // 發音：使用 Web Speech API 朗讀單字與例句
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.88; // 稍微放慢，適合國小高年級聆聽
      window.speechSynthesis.speak(utterance);
    }

    function switchTab(tab) {
      const tabs = ['daily', 'quiz-choice', 'quiz-cloze', 'library'];
      tabs.forEach(t => {
        const viewEl = document.getElementById(`view-${t}`);
        const tabEl = document.getElementById(`tab-${t}`);
        if (t === tab) {
          if (viewEl) viewEl.classList.remove('hidden');
          if (tabEl) {
            tabEl.className = "px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-amber-500 text-white shadow-sm";
          }
        } else {
          if (viewEl) viewEl.classList.add('hidden');
          if (tabEl) {
            tabEl.className = "px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-white text-slate-600 hover:bg-amber-50";
          }
        }
      });

      if (tab === 'quiz-choice') initChoiceQuiz();
      if (tab === 'quiz-cloze') initClozeQuiz();
      if (tab === 'library') renderLibraryWords();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      const dateDisplay = document.getElementById('display-date-str');
      const datePicker = document.getElementById('date-picker');
      const nextBtn = document.getElementById('btn-next-day');
      const resetBtn = document.getElementById('btn-today-reset');
      const bannerTitle = document.getElementById('daily-banner-title');

      const parts = selectedDateStr.split('-');
      const y = parts[0], m = parts[1], d = parts[2];
      
      const isToday = (selectedDateStr === TAIWAN_TODAY_STR);

      if (dateDisplay) {
        dateDisplay.innerText = `${y} 年 ${m} 月 ${d} 日 ${isToday ? '（今日）' : '（歷史複習）'}`;
      }

      if (datePicker) {
        datePicker.value = selectedDateStr;
        datePicker.max = TAIWAN_TODAY_STR; // 核心：鎖定明天，防偷看
      }

      if (nextBtn) {
        // 今天時鎖定「後一天」
        nextBtn.disabled = isToday;
      }

      if (resetBtn) {
        resetBtn.classList.toggle('hidden', isToday);
      }

      if (bannerTitle) {
        bannerTitle.innerText = isToday ? "今日進度：精選 5 單字" : `溫習進度：${m}/${d} 單字`;
      }

      renderDailyCards();
    }

    function changeDay(delta) {
      const current = new Date(selectedDateStr + 'T00:00:00');
      current.setDate(current.getDate() + delta);
      const targetStr = formatDateYMD(current);

      // 防偷看明天檢查
      if (targetStr > TAIWAN_TODAY_STR) return;

      selectedDateStr = targetStr;
      updateDateUI();
    }

    function onDateSelected(val) {
      if (!val) return;
      if (val > TAIWAN_TODAY_STR) {
        alert("明天還沒到唷！請小朋友一步一腳印，先把今天的單字熟記吧！");
        selectedDateStr = TAIWAN_TODAY_STR;
      } else {
        selectedDateStr = val;
      }
      updateDateUI();
    }

    function resetToToday() {
      selectedDateStr = TAIWAN_TODAY_STR;
      updateDateUI();
    }

    /* ==========================================================
       6. 字義測驗 (選擇題) 邏輯
       ========================================================== */
    let choiceWords = [];
    let choiceIndex = 0;
    let choiceAnswered = false;

    function initChoiceQuiz() {
      choiceWords = getWordsForDate(selectedDateStr);
      choiceIndex = 0;
      loadChoiceQuestion();
    }

    function loadChoiceQuestion() {
      choiceAnswered = false;
      const current = choiceWords[choiceIndex];
      document.getElementById('choice-progress').innerText = `${choiceIndex + 1} / 5`;
      document.getElementById('choice-question-word').innerText = current.en;
      document.getElementById('choice-feedback').innerText = '';
      document.getElementById('choice-next-btn').classList.add('hidden');

      // 產生 4 個選項 (1 個正解 + 3 個隨機干擾選項)
      let options = [current.zh];
      while (options.length < 4) {
        const randWord = WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
        if (!options.includes(randWord.zh)) {
          options.push(randWord.zh);
        }
      }
      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('choice-options-grid');
      grid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full min-h-[64px] px-5 py-3 rounded-2xl border-2 border-slate-200 bg-slate-50 hover:bg-amber-50 hover:border-amber-400 text-slate-800 text-xl font-black transition flex items-center justify-center text-center shadow-sm active:scale-98";
        btn.innerText = opt;
        btn.onclick = () => checkChoiceAnswer(opt, current.zh, btn);
        grid.appendChild(btn);
      });
    }

    function speakCurrentQuizWord() {
      const current = choiceWords[choiceIndex];
      if (current) speakText(current.en);
    }

    function checkChoiceAnswer(selected, correct, clickedBtn) {
      if (choiceAnswered) return;
      choiceAnswered = true;

      const buttons = document.querySelectorAll('#choice-options-grid button');
      const feedback = document.getElementById('choice-feedback');
      const nextBtn = document.getElementById('choice-next-btn');

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correct) {
          btn.className = "w-full min-h-[64px] px-5 py-3 rounded-2xl border-2 border-emerald-500 bg-emerald-100 text-emerald-800 text-xl font-black";
        }
      });

      if (selected === correct) {
        playSuccessSound();
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        feedback.innerText = "🎉 太棒了！回答完全正確！";
        feedback.className = "mt-6 text-center text-xl font-black text-emerald-600";
      } else {
        playWrongSound();
        clickedBtn.className = "w-full min-h-[64px] px-5 py-3 rounded-2xl border-2 border-rose-400 bg-rose-100 text-rose-800 text-xl font-black";
        feedback.innerText = `💪 別灰心，正確答案是「${correct}」，再記一次喔！`;
        feedback.className = "mt-6 text-center text-xl font-black text-rose-600";
      }

      nextBtn.classList.remove('hidden');
    }

    function nextChoiceQuiz() {
      choiceIndex++;
      if (choiceIndex < 5) {
        loadChoiceQuestion();
      } else {
        showQuizFinishModal("恭喜你完成今天的字義測驗！");
      }
    }

      document.getElementById('cloze-feedback').innerText = '';
      document.getElementById('cloze-next-btn').classList.add('hidden');
      
      const inputEl = document.getElementById('cloze-user-input');
      inputEl.value = '';
      inputEl.disabled = false;
      inputEl.focus();

      // 例句克漏字替換
      const regex = new RegExp(`\\b${current.en}\\b`, 'gi');
      let blankSentence = current.ex.replace(regex, "______");
      if (!blankSentence.includes("______")) {
        blankSentence = `${current.ex} (單字: ______)`;
      }

      document.getElementById('cloze-sentence-display').innerText = blankSentence;
      document.getElementById('cloze-sentence-zh').innerText = current.ex_zh;

      const firstL = current.en.charAt(0).toUpperCase();
      document.getElementById('cloze-hint-text').innerText = `💡 提示：字首是 ${firstL}，共 ${current.en.length} 個字母`;
    }

    function revealClozeHint() {
      const current = clozeWords[clozeIndex];
      const first = current.en.charAt(0);
      const last = current.en.charAt(current.en.length - 1);
      document.getElementById('cloze-hint-text').innerText = `💡 強力提示：首字母是 ${first}，結尾是 ${last}，中文意思為「${current.zh}」`;
    }

    function checkClozeAnswer() {
      if (clozeAnswered) return;
      const inputEl = document.getElementById('cloze-user-input');
      const userText = inputEl.value.trim().toLowerCase();
      const current = clozeWords[clozeIndex];
      const correctText = current.en.toLowerCase();
      const feedback = document.getElementById('cloze-feedback');
      const nextBtn = document.getElementById('cloze-next-btn');

      if (!userText) {
        feedback.innerText = "請先在框框中輸入單字喔！";
        feedback.className = "mt-6 text-center text-xl font-bold text-amber-600";
        return;
      }

      clozeAnswered = true;
      inputEl.disabled = true;

      if (userText === correctText) {
        playSuccessSound();
        confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
        feedback.innerText = `🎉 答對了！拼法就是「${current.en}」！`;
        feedback.className = "mt-6 text-center text-xl font-black text-emerald-600";
      } else {
        playWrongSound();
        feedback.innerText = `💪 差一點點！正確拼法是「${current.en}」(${current.zh})`;
        feedback.className = "mt-6 text-center text-xl font-black text-rose-600";
      }

      nextBtn.classList.remove('hidden');
    }

    // 支援 Enter 鍵送出答案
    document.getElementById('cloze-user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkClozeAnswer();
    });

    function nextClozeQuiz() {
      clozeIndex++;
      if (clozeIndex < 5) {
        loadClozeQuestion();
      } else {
        showQuizFinishModal("太厲害了！你完成了今天的例句克漏字挑戰！");
      }
    }

    function showQuizFinishModal(msg) {
      confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
      alert(`${msg}\n明天記得再來挑戰全新單字喔！`);
      switchTab('daily');
    }

    /* ==========================================================
       8. 主題字庫清單瀏覽與篩選
       ========================================================== */
    let currentCategoryFilter = 'ALL';

    function initCategoryFilterBar() {
      const bar = document.getElementById('category-filter-bar');
      if (!bar) return;
      
      const cats = Array.from(new Set(WORD_BANK.map(w => w.cat)));
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.innerText = cat;
        btn.className = "cat-pill px-4 py-2 rounded-xl text-base font-bold bg-amber-50 text-slate-700 hover:bg-amber-100 border border-amber-200 transition";
        btn.onclick = () => filterCategory(cat);
        bar.appendChild(btn);
      });

      document.getElementById('lib-total-count').innerText = WORD_BANK.length;
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      const pills = document.querySelectorAll('.cat-pill');
      pills.forEach(p => {
        if ((cat === 'ALL' && p.innerText === '全部單字') || p.innerText === cat) {
          p.className = "cat-pill px-4 py-2 rounded-xl text-base font-bold bg-amber-500 text-white shadow-sm transition";
        } else {
          p.className = "cat-pill px-4 py-2 rounded-xl text-base font-bold bg-amber-50 text-slate-700 hover:bg-amber-100 border border-amber-200 transition";
        }
      });
      renderLibraryWords();
    }

    function renderLibraryWords() {
      const container = document.getElementById('library-words-list');
      const searchKey = document.getElementById('lib-search-input').value.trim().toLowerCase();
      if (!container) return;

      container.innerHTML = '';

      let filtered = WORD_BANK;
      if (currentCategoryFilter !== 'ALL') {
        filtered = filtered.filter(w => w.cat === currentCategoryFilter);
      }

      if (searchKey) {
        filtered = filtered.filter(w => 
          w.en.toLowerCase().includes(searchKey) || 
          w.zh.includes(searchKey)
        );
      }

      // 最多顯示 100 筆以保持滑動極致順暢
      const slice = filtered.slice(0, 100);

      slice.forEach(w => {
        const card = document.createElement('div');
        card.className = "p-4 bg-amber-50/50 rounded-2xl border border-amber-200 flex justify-between items-center";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-2xl font-black text-amber-900">${w.en}</span>
              <span class="text-sm font-bold text-slate-500">${w.kk}</span>
              <span class="text-xs bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-black">${w.pos}</span>
            </div>
            <p class="text-lg font-extrabold text-slate-700 mt-1">${w.zh}</p>
            <p class="text-xs text-amber-700 mt-0.5 font-bold">📂 ${w.cat}</p>
          </div>
          <button onclick="speakText('${w.en}')" class="w-10 h-10 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 text-xl flex items-center justify-center transition">
            🔊
          </button>
        `;
        container.appendChild(card);
      });
    }

    /* ==========================================================
       9. 初始啟動
       ========================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      initCategoryFilterBar();
      updateDateUI();
    });
  </script>
</body>
</html>
