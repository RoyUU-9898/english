<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>每日 5 單字小學堂 - 柚子老師製作</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts 友善圓體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Confetti 彩帶特效 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* 平板與手機：維持適中尺寸 */
    html {
      font-size: 16px;
    }

    /* 筆電與桌機螢幕（1024px 以上）：字體與元素等比例自動放大 20% */
    @media (min-width: 1024px) {
      html {
        font-size: 19.5px;
      }
      main.max-w-4xl, header .max-w-4xl {
        max-width: 1100px !important;
      }
    }

    /* 大螢幕桌機或教室投影機（1440px 以上）：自動放大 35% */
    @media (min-width: 1440px) {
      html {
        font-size: 21.5px;
      }
      main.max-w-4xl, header .max-w-4xl {
        max-width: 1220px !important;
      }
    }

    * {
      font-family: 'Zen Maru Gothic', 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      touch-action: manipulation;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      background-color: #FEF9E7;

    .pomelo-btn-shadow {

    .mint-btn-shadow {

    }
    .mint-btn-shadow:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px #059669;

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #FEF3C7;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #FBBF24;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #F59E0B;

  <!-- 引入更名後的 words.js -->

</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-amber-200">

  <!-- 頂部導覽列 -->
  <header class="bg-white/95 backdrop-blur border-b-2 border-amber-200 sticky top-0 z-40 px-4 py-3 sm:py-4 shadow-sm">

      <div class="flex items-center gap-3">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-amber-900 tracking-wide">每日 5 字小學堂</h1>
        <span class="bg-amber-100 text-amber-800 text-sm sm:text-base font-bold px-3 py-1 rounded-full border border-amber-300">國中先修 1200 字</span>

            I eat an <span class="text-emerald-600 underline font-black">______</span> every day.
          </div>
          <div id="cloze-sentence-zh" class="text-lg sm:text-xl text-slate-600 mt-3 font-semibold">

        <div class="mt-6 flex justify-end">

            下一題 ➔

    <!-- 4. 主題分類字庫清單 -->
    <section id="view-library" class="hidden space-y-6">
      <div class="bg-white border-2 border-amber-200 rounded-3xl p-6 shadow-sm">

            <h3 class="text-2xl font-extrabold text-slate-800">國中生必背 1200 核心主題字庫</h3>
            <p class="text-base text-slate-500 mt-1">單字庫已完成嚴格去重，每一個單字皆不重複！</p>
          </div>
          <div class="text-amber-700 font-extrabold text-lg bg-amber-50 border border-amber-200 px-4 py-2 rounded-2xl">
            收錄：<span id="lib-total-count" class="text-amber-900 font-black">0</span> 字

        <!-- 主題分類按鈕列 -->

            全部單字
          </button>
        </div>

        <!-- 搜尋框 -->
        <div class="my-4">
          <input type="text" id="lib-search-input" oninput="renderLibraryWords()" placeholder="🔍 搜尋英文單字或中文意思..." class="w-full border-2 border-amber-200 rounded-2xl px-4 py-3 text-lg font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>

        <!-- 單字列表 -->
        <div id="library-words-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[550px] overflow-y-auto p-1"></div>
      </div>

  <!-- 頁面底部：深藍黑曜石膠囊「柚子老師製作」標章（使用純向量圖標，徹底消除圖片 404） -->
  <footer class="py-8 flex justify-center items-center">
    <div class="bg-[#1e293b] border border-slate-700/80 rounded-full px-6 py-2.5 flex items-center gap-3 shadow-lg select-none">
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center flex-shrink-0 shadow-inner p-1">
        <svg viewBox="0 0 100 100" class="w-full h-full">
          <!-- 熊貓頭部與耳朵 -->
          <circle cx="26" cy="26" r="14" fill="#1e293b"/>
          <circle cx="74" cy="26" r="14" fill="#1e293b"/>

          <!-- 黑眼圈 -->
          <ellipse cx="36" cy="48" rx="9" ry="12" fill="#1e293b" transform="rotate(-15 36 48)"/>
          <ellipse cx="64" cy="48" rx="9" ry="12" fill="#1e293b" transform="rotate(15 64 48)"/>
          <!-- 眼睛亮點 -->
          <circle cx="37" cy="46" r="3.5" fill="#ffffff"/>
          <circle cx="63" cy="46" r="3.5" fill="#ffffff"/>
          <!-- 斯文圓眼鏡框 -->
          <circle cx="36" cy="48" r="13" fill="none" stroke="#f59e0b" stroke-width="3"/>
          <circle cx="64" cy="48" r="13" fill="none" stroke="#f59e0b" stroke-width="3"/>
          <line x1="49" y1="48" x2="51" y2="48" stroke="#f59e0b" stroke-width="3"/>
          <!-- 小鼻子與微笑 -->
          <ellipse cx="50" cy="62" rx="4" ry="3" fill="#1e293b"/>
          <path d="M44 68 Q50 74 56 68" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>

      <span class="text-white font-extrabold text-lg sm:text-xl tracking-wider">
        柚子老師製作

  <script>
    /* ==========================================================
       1. 健壯單字庫初始化與去重
       ========================================================== */
    let WORD_BANK = [];
    let isInitialized = false;

    function buildWordBank() {
      const raw = (typeof RAW_WORD_LIST !== 'undefined' && Array.isArray(RAW_WORD_LIST))
        ? RAW_WORD_LIST
        : [];

      if (raw.length === 0) return false;

      const map = new Map();
      raw.forEach((item, index) => {
        if (!item || !item.en) return;
        const key = item.en.toLowerCase().trim();
        if (!map.has(key)) {
          map.set(key, {
            id: index + 1,
            en: item.en.trim(),
            zh: item.zh ? item.zh.trim() : "",
            kk: item.kk ? item.kk.trim() : "",
            pos: item.pos ? item.pos.trim() : "",
            cat: item.cat ? item.cat.trim() : "日常用品 🎒",
            ex: item.ex ? item.ex.trim() : `I like the word ${item.en}.`,
            ex_zh: item.ex_zh ? item.ex_zh.trim() : `我喜歡 ${item.en} 這個單字。`
          });
        }
      });

      WORD_BANK = Array.from(map.values()).map((w, idx) => ({ ...w, id: idx + 1 }));
      return WORD_BANK.length > 0;
    }

    /* ==========================================================
       2. 洗牌演算法（全學完一輪才洗牌第二次）
       ========================================================== */
    function seededRandom(seed) {
      const x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function getShuffledDeck(cycleNumber) {
      const deck = [...WORD_BANK];
      let seed = 20260901 + cycleNumber * 7789;
      for (let i = deck.length - 1; i > 0; i--) {
        const r = Math.floor(seededRandom(seed++) * (i + 1));
        const temp = deck[i];
        deck[i] = deck[r];
        deck[r] = temp;
      }
      return deck;
    }

    /* ==========================================================
       3. 台灣時間 (Asia/Taipei UTC+8) 與「每日完全換新 5 字」計算
       ========================================================== */
    function getTaiwanDateObject() {
      const now = new Date();
      const twString = now.toLocaleString("en-US", { timeZone: "Asia/Taipei" });
      return new Date(twString);
    }

    function formatDateYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const TAIWAN_TODAY_OBJ = getTaiwanDateObject();
    const TAIWAN_TODAY_STR = formatDateYMD(TAIWAN_TODAY_OBJ);
    let selectedDateStr = TAIWAN_TODAY_STR;

    const BASE_DATE_TIME = new Date("2026-01-01T00:00:00+08:00").getTime();

    function getWordsForDate(dateStr) {
      if (WORD_BANK.length === 0) return [];
      const targetTime = new Date(dateStr + "T00:00:00+08:00").getTime();
      const diffDays = Math.floor((targetTime - BASE_DATE_TIME) / (1000 * 60 * 60 * 24));
      const safeDays = Math.max(0, diffDays);

      const totalWords = WORD_BANK.length;
      const globalWordIndex = safeDays * 5; // 每天精確前進 5 個單字

      const cycle = Math.floor(globalWordIndex / totalWords);
      const indexInCycle = globalWordIndex % totalWords;

      const deck = getShuffledDeck(cycle);

      let result = [];
      if (indexInCycle + 5 <= totalWords) {
        result = deck.slice(indexInCycle, indexInCycle + 5);
      } else {
        const part1 = deck.slice(indexInCycle);
        const nextDeck = getShuffledDeck(cycle + 1);
        const part2 = nextDeck.slice(0, 5 - part1.length);
        result = [...part1, ...part2];
      }
      return result;
    }

    /* ==========================================================
       4. 歡樂音效引擎 (Web Audio API)
       ========================================================== */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSuccessSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.3, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.25);
        });
      } catch (e) {}
    }

    function playWrongSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.22);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {}
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      window.speechSynthesis.speak(utterance);
    }

    /* ==========================================================
       5. 頁面分頁與日期 UI
       ========================================================== */
    function switchTab(tab) {
      const tabs = ['daily', 'quiz-choice', 'quiz-cloze', 'library'];
      tabs.forEach(t => {
        const viewEl = document.getElementById(`view-${t}`);
        const tabEl = document.getElementById(`tab-${t}`);
        if (t === tab) {
          if (viewEl) viewEl.classList.remove('hidden');
          if (tabEl) {
            tabEl.className = "px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-amber-500 text-white shadow-sm";
          }
        } else {
          if (viewEl) viewEl.classList.add('hidden');
          if (tabEl) {
            tabEl.className = "px-4 py-2 rounded-xl font-bold text-base sm:text-lg transition-all bg-white text-slate-600 hover:bg-amber-50";
          }
        }
      });

      if (tab === 'quiz-choice') initChoiceQuiz();
      if (tab === 'quiz-cloze') initClozeQuiz();
      if (tab === 'library') renderLibraryWords();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateDateUI() {
      const dateDisplay = document.getElementById('display-date-str');
      const datePicker = document.getElementById('date-picker');
      const nextBtn = document.getElementById('btn-next-day');
      const resetBtn = document.getElementById('btn-today-reset');
      const bannerTitle = document.getElementById('daily-banner-title');

      const parts = selectedDateStr.split('-');
      const y = parts[0], m = parts[1], d = parts[2];
      const isToday = (selectedDateStr === TAIWAN_TODAY_STR);

      if (dateDisplay) {
        dateDisplay.innerText = `${y} 年 ${m} 月 ${d} 日 ${isToday ? '（今日）' : '（歷史溫習）'}`;
      }

      if (datePicker) {
        datePicker.value = selectedDateStr;
        datePicker.max = TAIWAN_TODAY_STR;
      }

      if (nextBtn) {
        nextBtn.disabled = isToday;
      }

      if (resetBtn) {
        resetBtn.classList.toggle('hidden', isToday);
      }

      if (bannerTitle) {
        bannerTitle.innerText = isToday ? "今日進度：精選 5 單字" : `溫習進度：${m}/${d} 單字`;
      }

      renderDailyCards();
    }

    function changeDay(delta) {
      const current = new Date(selectedDateStr + 'T00:00:00');
      current.setDate(current.getDate() + delta);
      const targetStr = formatDateYMD(current);

      if (targetStr > TAIWAN_TODAY_STR) return;

      selectedDateStr = targetStr;
      updateDateUI();
    }

    function onDateSelected(val) {
      if (!val) return;
      if (val > TAIWAN_TODAY_STR) {
        alert("明天還沒到唷！請小朋友一步一腳印，先把今天的單字熟記吧！");
        selectedDateStr = TAIWAN_TODAY_STR;
      } else {
        selectedDateStr = val;
      }
      updateDateUI();
    }

    function resetToToday() {
      selectedDateStr = TAIWAN_TODAY_STR;
      updateDateUI();
    }

    /* ==========================================================
       6. 渲染單字卡片
       ========================================================== */
    function renderDailyCards() {
      const container = document.getElementById('daily-cards-container');
      if (!container) return;
      container.innerHTML = '';

      const words = getWordsForDate(selectedDateStr);

      if (words.length === 0) {
        container.innerHTML = `
          <div class="bg-rose-50 border-2 border-rose-200 rounded-3xl p-6 text-center text-rose-800">
            <h4 class="text-xl font-black mb-2">⚠️ 尚未讀取到單字資料庫</h4>
            <p class="text-base font-bold text-slate-600">請確認 GitHub 倉庫中是否已成功上傳 <code class="bg-white px-2 py-1 rounded border">words.js</code> 檔案。</p>
          </div>
        `;
        return;
      }

      words.forEach((w, idx) => {
        const card = document.createElement('div');
        card.className = "bg-white border-2 border-amber-200 rounded-3xl p-5 sm:p-6 shadow-sm hover:shadow-md transition";
        card.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-amber-100">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-full bg-amber-100 text-amber-800 font-extrabold flex items-center justify-center text-base">
                ${idx + 1}
              </span>
              <div>
                <h3 class="text-3xl sm:text-4xl font-black text-amber-900 tracking-wide inline-block">${w.en}</h3>
                <span class="text-base sm:text-lg text-slate-500 font-bold ml-2">${w.kk}</span>
                <span class="bg-amber-100 text-amber-800 text-sm font-black px-2.5 py-0.5 rounded-lg ml-2">${w.pos}</span>
                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded-md ml-1">${w.cat}</span>
              </div>
            </div>
            <div class="flex items-center gap-3 justify-between sm:justify-end">
              <span class="text-2xl sm:text-3xl font-extrabold text-slate-700">${w.zh}</span>
              <button onclick="speakText('${w.en}')" class="w-12 h-12 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-800 text-2xl flex items-center justify-center transition active:scale-95 shadow-sm" title="朗讀單字">
                🔊
              </button>
            </div>
          </div>

          <div class="mt-4 bg-amber-50/60 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <p class="text-xl sm:text-2xl font-bold text-slate-800 leading-snug">${w.ex}</p>
              <p class="text-base sm:text-lg text-slate-500 font-semibold mt-1">${w.ex_zh}</p>
            </div>
            <button onclick="speakText('${w.ex.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl bg-white border border-amber-300 text-amber-800 text-sm sm:text-base font-bold flex items-center gap-1.5 shadow-sm hover:bg-amber-100 transition whitespace-nowrap">
              <span>🗣️</span> 聽例句
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* ==========================================================
       7. 字義測驗 (選擇題)
       ========================================================== */
    let choiceWords = [];
    let choiceIndex = 0;
    let choiceAnswered = false;

    function initChoiceQuiz() {
      choiceWords = getWordsForDate(selectedDateStr);
      choiceIndex = 0;
      loadChoiceQuestion();
    }

    function loadChoiceQuestion() {
      if (choiceWords.length === 0) return;
      choiceAnswered = false;
      const current = choiceWords[choiceIndex];
      document.getElementById('choice-progress').innerText = `${choiceIndex + 1} / 5`;
      document.getElementById('choice-question-word').innerText = current.en;
      document.getElementById('choice-feedback').innerText = '';
      document.getElementById('choice-next-btn').classList.add('hidden');

      let options = [current.zh];
      while (options.length < 4 && options.length < WORD_BANK.length) {
        const randWord = WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
        if (!options.includes(randWord.zh)) {
          options.push(randWord.zh);
        }
      }
      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('choice-options-grid');
      grid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full min-h-[64px] px-5 py-3 rounded-2xl border-2 border-slate-200 bg-slate-50 hover:bg-amber-50 hover:border-amber-400 text-slate-800 text-xl font-black transition flex items-center justify-center text-center shadow-sm active:scale-98";
        btn.innerText = opt;
        btn.onclick = () => checkChoiceAnswer(opt, current.zh, btn);
        grid.appendChild(btn);
      });
    }

    function speakCurrentQuizWord() {
      const current = choiceWords[choiceIndex];
      if (current) speakText(current.en);
    }

    function checkChoiceAnswer(selected, correct, clickedBtn) {
      if (choiceAnswered) return;
      choiceAnswered = true;

      const buttons = document.querySelectorAll('#choice-options-grid button');
      const feedback = document.getElementById('choice-feedback');
      const nextBtn = document.getElementById('choice-next-btn');

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correct) {
          btn.className = "w-full min-h-[64px] px-5 py-3 rounded-2xl border-2 border-emerald-500 bg-emerald-100 text-emerald-800 text-xl font-black";
        }
      });

      if (selected === correct) {
        playSuccessSound();
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        feedback.innerText = "🎉 太棒了！回答完全正確！";
        feedback.className = "mt-6 text-center text-xl font-black text-emerald-600";
      } else {
        playWrongSound();
        clickedBtn.className = "w-full min-h-[64px] px-5 py-3 rounded-2xl border-2 border-rose-400 bg-rose-100 text-rose-800 text-xl font-black";
        feedback.innerText = `💪 別灰心，正確答案是「${correct}」，再記一次喔！`;
        feedback.className = "mt-6 text-center text-xl font-black text-rose-600";
      }

      nextBtn.classList.remove('hidden');
    }

    function nextChoiceQuiz() {
      choiceIndex++;
      if (choiceIndex < 5) {
        loadChoiceQuestion();
      } else {
        showQuizFinishModal("恭喜你完成今天的字義測驗！");
      }
    }

    /* ==========================================================
       8. 例句克漏字填空測驗
       ========================================================== */
    let clozeWords = [];
    let clozeIndex = 0;
    let clozeAnswered = false;

    function initClozeQuiz() {
      clozeWords = getWordsForDate(selectedDateStr);
      clozeIndex = 0;
      loadClozeQuestion();
    }

    function loadClozeQuestion() {
      if (clozeWords.length === 0) return;
      clozeAnswered = false;
      const current = clozeWords[clozeIndex];
      document.getElementById('cloze-progress').innerText = `${clozeIndex + 1} / 5`;
      document.getElementById('cloze-feedback').innerText = '';
      document.getElementById('cloze-next-btn').classList.add('hidden');
      
      const inputEl = document.getElementById('cloze-user-input');
      inputEl.value = '';
      inputEl.disabled = false;
      inputEl.focus();

      const regex = new RegExp(`\\b${current.en}\\b`, 'gi');
      let blankSentence = current.ex.replace(regex, "______");
      if (!blankSentence.includes("______")) {
        blankSentence = `${current.ex} (單字: ______)`;
      }

      document.getElementById('cloze-sentence-display').innerText = blankSentence;
      document.getElementById('cloze-sentence-zh').innerText = current.ex_zh;

      const firstL = current.en.charAt(0).toUpperCase();
      document.getElementById('cloze-hint-text').innerText = `💡 提示：字首是 ${firstL}，共 ${current.en.length} 個字母`;
    }

    function revealClozeHint() {
      const current = clozeWords[clozeIndex];
      const first = current.en.charAt(0);
      const last = current.en.charAt(current.en.length - 1);
      document.getElementById('cloze-hint-text').innerText = `💡 強力提示：首字母是 ${first}，結尾是 ${last}，中文意思為「${current.zh}」`;
    }

    function checkClozeAnswer() {
      if (clozeAnswered) return;
      const inputEl = document.getElementById('cloze-user-input');
      const userText = inputEl.value.trim().toLowerCase();
      const current = clozeWords[clozeIndex];
      const correctText = current.en.toLowerCase();
      const feedback = document.getElementById('cloze-feedback');
      const nextBtn = document.getElementById('cloze-next-btn');

      if (!userText) {
        feedback.innerText = "請先在框框中輸入單字喔！";
        feedback.className = "mt-6 text-center text-xl font-bold text-amber-600";
        return;
      }

      clozeAnswered = true;
      inputEl.disabled = true;

      if (userText === correctText) {
        playSuccessSound();
        confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
        feedback.innerText = `🎉 答對了！拼法就是「${current.en}」！`;
        feedback.className = "mt-6 text-center text-xl font-black text-emerald-600";
      } else {
        playWrongSound();
        feedback.innerText = `💪 差一點點！正確拼法是「${current.en}」(${current.zh})`;
        feedback.className = "mt-6 text-center text-xl font-black text-rose-600";
      }

      nextBtn.classList.remove('hidden');
    }

    document.getElementById('cloze-user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkClozeAnswer();
    });

    function nextClozeQuiz() {
      clozeIndex++;
      if (clozeIndex < 5) {
        loadClozeQuestion();
      } else {
        showQuizFinishModal("太厲害了！你完成了今天的例句克漏字挑戰！");
      }
    }

    function showQuizFinishModal(msg) {
      confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
      alert(`${msg}\n明天記得再來挑戰全新單字喔！`);
      switchTab('daily');
    }

    /* ==========================================================
       9. 主題字庫清單與分類篩選
       ========================================================== */
    let currentCategoryFilter = 'ALL';

    function initCategoryFilterBar() {
      const bar = document.getElementById('category-filter-bar');
      if (!bar) return;
      
      bar.innerHTML = `
        <button onclick="filterCategory('ALL')" class="cat-pill active-cat px-4 py-2 rounded-xl text-base font-bold bg-amber-500 text-white shadow-sm transition">
          全部單字
        </button>
      `;

      const cats = Array.from(new Set(WORD_BANK.map(w => w.cat))).filter(Boolean);
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.innerText = cat;
        btn.className = "cat-pill px-4 py-2 rounded-xl text-base font-bold bg-amber-50 text-slate-700 hover:bg-amber-100 border border-amber-200 transition";
        btn.onclick = () => filterCategory(cat);
        bar.appendChild(btn);
      });

      const countEl = document.getElementById('lib-total-count');
      if (countEl) countEl.innerText = WORD_BANK.length;
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      const pills = document.querySelectorAll('.cat-pill');
      pills.forEach(p => {
        if ((cat === 'ALL' && p.innerText === '全部單字') || p.innerText === cat) {
          p.className = "cat-pill px-4 py-2 rounded-xl text-base font-bold bg-amber-500 text-white shadow-sm transition";
        } else {
          p.className = "cat-pill px-4 py-2 rounded-xl text-base font-bold bg-amber-50 text-slate-700 hover:bg-amber-100 border border-amber-200 transition";
        }
      });
      renderLibraryWords();
    }

    function renderLibraryWords() {
      const container = document.getElementById('library-words-list');
      const searchKey = document.getElementById('lib-search-input').value.trim().toLowerCase();
      if (!container) return;

      container.innerHTML = '';

      let filtered = WORD_BANK;
      if (currentCategoryFilter !== 'ALL') {
        filtered = filtered.filter(w => w.cat === currentCategoryFilter);
      }

      if (searchKey) {
        filtered = filtered.filter(w => 
          w.en.toLowerCase().includes(searchKey) || 
          w.zh.includes(searchKey)
        );
      }

      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = "p-4 bg-amber-50/50 rounded-2xl border border-amber-200 flex justify-between items-center";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-2xl font-black text-amber-900">${w.en}</span>
              <span class="text-sm font-bold text-slate-500">${w.kk}</span>
              <span class="text-xs bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-black">${w.pos}</span>
            </div>
            <p class="text-lg font-extrabold text-slate-700 mt-1">${w.zh}</p>
            <p class="text-xs text-amber-700 mt-0.5 font-bold">📂 ${w.cat}</p>
          </div>
          <button onclick="speakText('${w.en}')" class="w-10 h-10 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 text-xl flex items-center justify-center transition">
            🔊
          </button>
        `;
        container.appendChild(card);
      });
    }

    /* ==========================================================
       10. 健全啟動程序 (輪詢確保單字庫完全注入)
       ========================================================== */
    function startApp() {
      if (isInitialized) return;
      const success = buildWordBank();
      if (success) {
        isInitialized = true;
        initCategoryFilterBar();
        updateDateUI();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      startApp();
      let attempts = 0;
      const timer = setInterval(() => {
        if (isInitialized || attempts > 15) {
          clearInterval(timer);
          if (!isInitialized) updateDateUI();
        } else {
          attempts++;
          startApp();
        }
      }, 200);
    });
  </script>
</body>
</html>
